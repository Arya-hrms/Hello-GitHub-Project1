
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Application | Green Valley HRMS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #20372a;
            min-height: 100vh;
            background: linear-gradient(120deg, #103b29, #246344);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 18px;
        }

        .background-circle {
            position: fixed;
            width: 360px;
            height: 360px;
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 50%;
            pointer-events: none;
        }

        .circle-one {
            top: -130px;
            right: -100px;
        }

        .circle-two {
            bottom: -180px;
            left: -100px;
            width: 430px;
            height: 430px;
        }

        .form-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 560px;
            padding: 38px 42px;
            background: #ffffff;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 18px;
            box-shadow: 0 24px 70px rgba(0,0,0,0.20);
        }

        .form-logo {
            width: 55px;
            height: 55px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #174d36;
            color: #ffffff;
            border-radius: 13px;
            font-size: 21px;
            font-weight: bold;
            letter-spacing: -1px;
        }

        .institute-name {
            margin-bottom: 5px;
            color: #174d36;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        .form-label {
            display: inline-block;
            margin: 12px 0 7px;
            color: #27824a;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .form-container h1 {
            margin-bottom: 8px;
            color: #174d36;
            font-size: 30px;
            line-height: 1.3;
        }

        .description {
            margin-bottom: 26px;
            color: #778379;
            font-size: 13px;
            line-height: 1.7;
        }

        .leave-form {
            display: grid;
            grid-template-columns: 1fr;
            gap: 17px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .form-group label {
            margin-bottom: 7px;
            color: #304b38;
            font-size: 12px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            min-height: 46px;
            padding: 12px;
            border: 1px solid #dce6de;
            border-radius: 7px;
            outline: none;
            background: #fbfdfb;
            color: #20372a;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #398657;
            box-shadow: 0 0 0 3px rgba(57,134,87,0.12);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #9aa69d;
        }

        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 3px;
        }

        .submit-btn,
        .cancel-btn {
            flex: 1;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 7px;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.3s, transform 0.3s;
        }

        .submit-btn {
            background: #174d36;
            color: #ffffff;
        }

        .submit-btn:hover {
            background: #26764a;
            transform: translateY(-2px);
        }

        .cancel-btn {
            background: #edf3ee;
            color: #174d36;
            border: 1px solid #dce6de;
        }

        .cancel-btn:hover {
            background: #dcebe0;
        }

        .bottom-note {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #e5ede7;
            color: #89958b;
            font-size: 10px;
            line-height: 1.8;
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .form-container {
                padding: 28px 22px;
                border-radius: 14px;
            }

            .form-container h1 {
                font-size: 26px;
            }

            .date-row {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- Background Decoration -->
    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>

    <!-- Leave Application Container -->
    <main class="form-container">

        <!-- Logo -->
        <div class="form-logo">GV</div>

        <p class="institute-name">
            GREEN VALLEY INSTITUTE OF TECHNOLOGY
        </p>

        <span class="form-label">EMPLOYEE PORTAL</span>

        <h1>Leave Application</h1>

        <p class="description">
            Apply for leave by filling in the details below.
            Your application will be submitted for approval.
        </p>

        <!-- Leave Application Form -->
        <form class="leave-form" method="POST"
              action="{% url 'apply_leave_form' %}">

            {% csrf_token %}

            <!-- Leave Type -->
            <div class="form-group">
                <label for="leave_type">Leave Type</label>

                <select id="leave_type" name="leave_type" required>
                    <option value="">Select Leave Type</option>
                    <option value="Casual Leave">Casual Leave</option>
                    <option value="Sick Leave">Sick Leave</option>
                    
                    <option value="Emergency Leave">Emergency Leave</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Date Selection -->
            <div class="date-row">

                <div class="form-group">
                    <label for="from_date">From Date</label>
                    <input type="date" id="from_date"
                           name="from_date" required>
                </div>

                <div class="form-group">
                    <label for="to_date">To Date</label>
                    <input type="date" id="to_date"
                           name="to_date" required>
                </div>

            </div>

            <!-- Reason -->
            <div class="form-group">
                <label for="reason">Reason for Leave</label>

                <textarea id="reason" name="reason"
                    placeholder="Enter your leave reason..."
                    required></textarea>
            </div>

            <!-- Buttons -->
            <div class="form-actions">

                <button type="submit" class="submit-btn">
                    Apply Leave →
                </button>

                <a href="{% url 'apply_leave' %}"
                   class="cancel-btn">
                    Cancel
                </a>

            </div>

        </form>

        <!-- Bottom Text -->
        <p class="bottom-note">
            Green Valley Institute of Technology<br>
            Human Resource Management System
        </p>

    </main>

</body>
</html>
